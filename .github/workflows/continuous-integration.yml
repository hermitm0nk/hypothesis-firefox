name: Firefox build, test and signing

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  firefox:
    runs-on: ubuntu-latest
    env:
      FIREFOX_FORK_BUILD: '1'
      AMO_API_KEY: ${{ secrets.AMO_API_KEY }}
      AMO_API_SECRET: ${{ secrets.AMO_API_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies and test browser
        run: |
          yarn install --immutable
          yarn playwright install --with-deps chromium
          touch node_modules/.uptodate
      - name: Check formatting, lint and types
        run: |
          make checkformatting
          make lint
      - name: Run unit tests
        run: make test
      - name: Build Firefox XPI
        run: |
          make clean
          touch node_modules/.uptodate
          make build SETTINGS_FILE=settings/firefox-prod.json dist/hypothesis-firefox.xpi
          node --test tests/firefox-build-test.mjs
          node --test tests/oauth-relay-test.mjs
          node --test tests/sidebar-page-theme-test.mjs tests/sidebar-theme-test.mjs tests/firefox-update-manifest-test.mjs
          yarn web-ext lint --source-dir build --self-hosted
      - name: Upload unsigned package for inspection
        uses: actions/upload-artifact@v4
        with:
          name: firefox-unsigned-xpi
          path: dist/hypothesis-firefox.xpi
          retention-days: 30
      # AMO credentials are repository Actions secrets, never stored in git.
      # An unsigned XPI cannot be installed persistently in stable Firefox.
      - name: Sign for self-distribution with Mozilla
        if: github.event_name != 'pull_request' && env.AMO_API_KEY != '' && env.AMO_API_SECRET != ''
        run: |
          mkdir -p signed
          yarn web-ext sign --source-dir build --artifacts-dir signed \
            --channel unlisted --api-key "$AMO_API_KEY" --api-secret "$AMO_API_SECRET"
          version=$(node -p "require('./package.json').version")
          mv signed/*.xpi "signed/hypothesis-firefox-v${version}-build${GITHUB_RUN_NUMBER}.xpi"
          xpi="signed/hypothesis-firefox-v${version}-build${GITHUB_RUN_NUMBER}.xpi"
          addon_version=$(node -p "JSON.parse(require('fs').readFileSync('build/manifest.json')).version")
          addon_id=$(node -p "JSON.parse(require('fs').readFileSync('build/manifest.json')).browser_specific_settings.gecko.id")
          tag="v${version}-firefox.${GITHUB_RUN_NUMBER}"
          node tools/create-firefox-update-manifest.js \
            "$xpi" "$addon_version" "$addon_id" "$GITHUB_REPOSITORY" "$tag"
      - name: Upload signed installable XPI
        if: github.event_name != 'pull_request' && env.AMO_API_KEY != '' && env.AMO_API_SECRET != ''
        uses: actions/upload-artifact@v4
        with:
          name: firefox-signed-installable-xpi
          path: signed/*.xpi
          if-no-files-found: error
      - name: Publish signed XPI as a GitHub Release
        if: github.event_name != 'pull_request' && env.AMO_API_KEY != '' && env.AMO_API_SECRET != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          gh release create "v${version}-firefox.${GITHUB_RUN_NUMBER}" \
            signed/*.xpi updates.json \
            --target "$GITHUB_SHA" \
            --title "Hypothesis Firefox v${version} (build ${GITHUB_RUN_NUMBER})" \
            --notes "Community Firefox build signed by Mozilla for self-distribution. Install the XPI once; Firefox checks updates.json in this release for future signed updates."
